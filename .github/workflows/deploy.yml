name: deploy zoodefense

# 動物園守護戰（zoodefense.hunglun.com）：靜態網頁，push main 就自動部署。沒有 Worker 程式、沒有資料庫。
# 原始碼真正的家在 ClaudeOnly 的 school/lun-zoodefense/，由 scripts/publish-public.sh 同步上來。
# Actions secrets：CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID（hunglun2026）。

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-zoodefense
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 安裝相依套件
        run: npm ci
      - name: 難度模擬與資料檢查
        run: npm test
      - name: 部署到 Cloudflare（hunglun2026）
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
